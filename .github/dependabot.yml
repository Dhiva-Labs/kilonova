version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    # flutter_rust_bridge must move in lockstep with its Dart package and
    # the codegen; upgrade it by hand.
    ignore:
      - dependency-name: flutter_rust_bridge
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: flutter_rust_bridge
      # Pinned by flutter_localizations in the Flutter SDK; moves with Flutter.
      - dependency-name: intl
