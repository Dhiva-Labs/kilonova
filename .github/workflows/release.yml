name: Release

# Pushing a tag like v0.1.0 builds every platform and opens a draft release
# with the files and their SHA-256 sums. A maintainer reviews the draft and
# publishes it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.6
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.KN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::KN_KEYSTORE_BASE64 is not set; release APKs must be signed with the release key."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        env:
          KN_KEYSTORE_PASSWORD: ${{ secrets.KN_KEYSTORE_PASSWORD }}
          KN_KEY_ALIAS: ${{ secrets.KN_KEY_ALIAS }}
          KN_KEY_PASSWORD: ${{ secrets.KN_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Name the files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/kilonova-$version-android-$abi.apk"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/

  linux:
    name: Linux tarball and .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - working-directory: app
        run: flutter build linux --release
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          tar -C app/build/linux/x64/release -czf "dist/kilonova-$version-linux-x64.tar.gz" \
            --transform "s,^bundle,kilonova-$version," bundle
          packaging/linux/build-deb.sh "$version" app/build/linux/x64/release/bundle dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/

  windows:
    name: Windows zip and installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install pinned toolchain
        working-directory: core
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - working-directory: app
        run: flutter build windows --release
      - name: Package
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          New-Item -ItemType Directory dist | Out-Null
          $release = "app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$release\*" -DestinationPath "dist\kilonova-$version-windows-x64.zip"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\$release" "/DOutputDir=$PWD\dist" packaging\windows\kilonova.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/

  draft:
    name: Draft release
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * \
            --draft --prerelease \
            --title "Kilonova ${GITHUB_REF_NAME}" \
            --notes-file ../docs/release-notes/"${GITHUB_REF_NAME}".md
