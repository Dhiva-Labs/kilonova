name: Linux

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'PRIVACY.md'
      - '.github/workflows/linux.yml'
      - '.github/actions/setup-flutter/**'
      - 'tools/ci/**'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'PRIVACY.md'
      - '.github/workflows/linux.yml'
      - '.github/actions/setup-flutter/**'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Flutter (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Install pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Build Rust core for widget tests
        working-directory: core
        run: cargo build
      - name: Assert the Rust library is ${{ matrix.arch }}
        run: tools/ci/assert-elf-arch.sh core/target/debug/libkn_ffi.so ${{ matrix.arch }}
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - name: Integration test (real app, Rust built by cargokit)
        working-directory: app
        run: xvfb-run -a flutter test integration_test -d linux
      - working-directory: app
        run: flutter build linux --release
      - name: Assert every ELF file in the bundle is ${{ matrix.arch }}
        run: >
          tools/ci/assert-elf-arch.sh app/build/linux/${{ matrix.arch }}/release/bundle ${{ matrix.arch }}
          kilonova lib/libkn_ffi.so lib/libapp.so lib/libflutter_linux_gtk.so
