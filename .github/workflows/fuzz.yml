name: Fuzz

# Runs each fuzz target for a few minutes every week. Crashing inputs are
# uploaded; see core/fuzz/README.md.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [lws_replies, addresses, wallet_files, backup_bundles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz for five minutes
        working-directory: core/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: core/fuzz/artifacts/
