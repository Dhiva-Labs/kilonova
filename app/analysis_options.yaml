include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/rust/**
    - lib/l10n/generated/**
    # Vendored cargokit; its build tool resolves its own packages at build time.
    - rust_builder/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
