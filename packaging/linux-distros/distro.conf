# Package metadata for the other-distribution packages (.rpm, Arch package,
# AppImage, AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/linux/build-deb.sh).

NAME=kilonova
APP_NAME=Kilonova
GITHUB_REPO=Dhiva-Labs/kilonova
TAG_PREFIX=v
SUMMARY='Monero wallet for full nodes and light wallet servers'
DESCRIPTION='Kilonova scans the Monero blockchain on your device from a node you choose, or syncs through a light wallet server and checks what it reports with your own keys. Not audited yet; keep only small amounts in it.'
MAINTAINER='Dhiva Labs <reachout@dhivalabs.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/kilonova
LICENSE=MIT
LICENSE_FILE=LICENSE

# lib/libdartjni.so comes from the `jni` package, which the Android plugins
# pull in; no Dart code in the app imports it. CMake builds it only when it
# finds a JDK (the CI runners have one), links it to that JDK's libjvm.so
# and never loads it on the desktop. Shipping it would make rpm require
# libjvm.so and fail the ldd check on every distribution, so these formats
# leave it out (the Flatpak manifest removes it as well).
EXCLUDE=(opt/kilonova/lib/libdartjni.so)

# rpm: libraries come from the ELF files, except EGL and GLES: Flutter's
# engine opens them at run time (libepoxy), so they are no NEEDED entries,
# and a minimal Fedora does not have libGLESv2. As rpm soname capabilities
# they resolve on Fedora and openSUSE alike. Kilonova runs no other program.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# Arch: what the .deb Depends on (libgtk-3-0, libstdc++6), and libglvnd for
# EGL and GLES as above.
ARCH_DEPENDS=(gtk3 gcc-libs libglvnd)
ARCH_INDEPENDENT=0

# AppImage: the .deb's tree, started at the Flutter runner (it finds lib/
# and data/ next to itself).
APPIMAGE=1
EXEC=opt/kilonova/kilonova
DESKTOP=usr/share/applications/com.dhivalabs.kilonova.desktop
ICON=usr/share/icons/hicolor/256x256/apps/com.dhivalabs.kilonova.png
APPRUN_ENV=''

# Smoke test in each distribution container (verify.sh mounts the repository
# at /src): tools/ci/smoke-linux.sh, the same one the .deb runs, which waits
# for the Kilonova window and for the wallet folder the Dart start-up code
# creates through the Rust library.
GUI_CMD=kilonova
SMOKE_SCRIPT=tools/ci/smoke-linux.sh
SMOKE_SECONDS=20
SMOKE_CMD=''
