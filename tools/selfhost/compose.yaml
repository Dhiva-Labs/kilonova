# Your own Monero node and light wallet server, reachable from anywhere as a
# Tor onion service, with nothing to open on your router. See README.md.
#
#   docker compose up -d          # start (the node then syncs, for days)
#   docker compose run --rm pair  # print the pairing code for Kilonova
#   ./push-register <address>     # payment pushes for one wallet

x-monerod: &monerod
  image: ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1@sha256:0329465ffc599048efd57712d91d3b4b7d66380bd7205d5d0992cd9faf668e38
  restart: unless-stopped

services:
  monerod:
    <<: *monerod
    command:
      - --prune-blockchain
      - --data-dir=/data
      - --no-igd
      # Restricted RPC for wallets, inside the compose network only; Tor
      # carries it outside.
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --confirm-external-bind
      # For monero-lws.
      - --zmq-rpc-bind-ip=0.0.0.0
      - --zmq-rpc-bind-port=18082
      - --confirm-zmq-rpc-external-bind
      - --zmq-pub=tcp://0.0.0.0:18083
    volumes:
      - monerod-data:/data

  lws:
    image: ghcr.io/vtnerd/monero-lws:0.3@sha256:573c3ba3c3034e0b046bd5b42001b4097e2a96af0c4284ed80e052d300955903
    restart: unless-stopped
    depends_on: [monerod]
    command:
      - --network=main
      - --db-path=/data
      - --daemon=tcp://monerod:18082
      - --sub=tcp://monerod:18083
      - --rest-server=http://0.0.0.0:8443
      - --confirm-external-bind
      # Only your own wallets can reach this server (through the onion
      # address you keep), so new wallets need no manual approval.
      - --auto-accept-creation
      - --auto-accept-import
      - --max-subaddresses=1000
      # The admin API, for push-register: on this container's loopback
      # only, so nothing else on the network (and nothing through Tor)
      # reaches it.
      - --admin-rest-server=http://127.0.0.1:8444
      - --disable-admin-auth
    volumes:
      - lws-data:/data

  # Payment pushes. monero-lws calls the relay's webhook; the relay drops
  # what the webhook says (amount, transaction id) and posts only the
  # wallet's random token to ntfy, which phones and desktops reach through
  # the onion service. See README.md.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    restart: unless-stopped
    command: [serve]
    environment:
      NTFY_LISTEN_HTTP: ":80"
      # No upstream server: nothing is forwarded to ntfy.sh or anyone else.
      NTFY_UPSTREAM_BASE_URL: ""
      NTFY_WEB_ROOT: disable
      NTFY_LOG_LEVEL: warn

  relay:
    build: relay
    restart: unless-stopped
    depends_on: [ntfy]
    volumes:
      - relay-data:/data

  # One-shot, run by ./push-register: adds the webhook for one wallet. It
  # shares the light wallet server's network to reach its admin API.
  push-register:
    build: relay
    profiles: [push]
    network_mode: service:lws
    entrypoint: ["/usr/local/bin/register"]
    environment:
      KN_PUSH_SERVER: ${KN_PUSH_SERVER:-}
    volumes:
      - relay-data:/data

  tor:
    build: tor
    restart: unless-stopped
    depends_on: [monerod, lws, ntfy, relay]
    volumes:
      - tor-data:/var/lib/tor

  # One-shot: prints the pairing code and QR once Tor has made the address.
  pair:
    build: tor
    profiles: [pair]
    entrypoint: ["/usr/local/bin/pair"]
    environment:
      KN_NETWORK: mainnet
    volumes:
      - tor-data:/var/lib/tor:ro

volumes:
  monerod-data:
  lws-data:
  tor-data:
  relay-data:
