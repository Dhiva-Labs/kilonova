[package]
name = "kn_ffi"
description = "The Rust API surface the Kilonova app calls through flutter_rust_bridge"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
kn-keys = { path = "../kn-keys" }
kn-store = { path = "../kn-store" }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
