[package]
name = "kn_ffi"
description = "The Rust API surface the Kilonova app calls through flutter_rust_bridge"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
kn-keys = { path = "../kn-keys" }
kn-store = { path = "../kn-store" }
kn-sync = { path = "../kn-sync" }
kn-tx = { path = "../kn-tx" }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
zeroize = "1.8"

# The background worker calls in without a Flutter engine.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[dev-dependencies]
monero-wallet = { version = "=0.2.0", default-features = false, features = ["std", "compile-time-generators"] }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"

[lints]
workspace = true
