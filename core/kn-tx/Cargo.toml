[package]
name = "kn-tx"
description = "Building, signing and publishing Kilonova transactions"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "precomputed-tables"] }
hex = "0.4"
kn-keys = { path = "../kn-keys" }
kn-sync = { path = "../kn-sync" }
monero-daemon-rpc = { version = "=0.2.0", features = ["std"] }
monero-interface = { version = "=0.2.0", features = ["std"] }
monero-wallet = { version = "=0.2.0", default-features = false, features = ["std", "compile-time-generators"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
